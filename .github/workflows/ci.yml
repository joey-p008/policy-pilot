name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @policy-pilot/backend

      - name: Format, lint, type-check, and unit tests
        run: npm run ci

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: policy_pilot
          POSTGRES_PASSWORD: policy_pilot
          POSTGRES_DB: policy_pilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policy_pilot -d policy_pilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://policy_pilot:policy_pilot@localhost:5432/policy_pilot?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      OPENAI_API_KEY: sk-ci-placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @policy-pilot/backend

      - name: Apply Prisma migrations
        run: npm run prisma:migrate:deploy -w @policy-pilot/backend

      - name: Run integration tests
        run: npm run test:integration

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build --file Dockerfile --tag policy-pilot:ci .
