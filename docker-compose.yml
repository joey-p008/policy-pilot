services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: policy-pilot-postgres
    environment:
      POSTGRES_USER: policy_pilot
      POSTGRES_PASSWORD: policy_pilot
      POSTGRES_DB: policy_pilot
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/01-init-pgvector.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U policy_pilot -d policy_pilot']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: policy-pilot-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
